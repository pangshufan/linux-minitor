  <section class="login-story"><a class="brand" href="/"><span class="brand-mark">M</span><span>MONITOR<small>基础设施监控</small></span></a><div><p class="eyebrow">OBSERVE · UNDERSTAND · RESPOND</p><h1>每一台服务器，<br>尽在掌握。</h1><p>从主机资源到服务进程，让系统运行状态清晰可见。</p><div class="login-signals"><span>主机与服务</span><span>实时指标</span><span>告警通知</span></div></div><small>Linux &amp; Windows · Infrastructure monitoring</small></section>
